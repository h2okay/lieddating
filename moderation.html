<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lieddating · Moderation</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.logo{font-family:Shrikhand,Georgia,serif;font-size:28px;line-height:1;color:var(--amber)}
.logo span{color:var(--pink)}
.logo small{font-family:"DM Sans",sans-serif;font-size:13px;color:var(--muted);margin-left:8px;letter-spacing:.1em;text-transform:uppercase}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.now{display:flex;flex-direction:column;gap:4px}
.now .display{font-size:26px;color:var(--amber)}
.now .names{font-size:20px;font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
td.n{text-align:right;white-space:nowrap}
.demo-banner{margin:-18px -16px 12px;border-radius:0}
tr.away td{opacity:.45}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st.ready{color:var(--ok);border-color:rgba(123,227,138,.4)}
.st.sung{color:var(--muted)}
.st.wait{border-style:dashed;color:var(--muted)}
.bar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-left:6px}
ol.hist{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.tag{font-size:11px;color:var(--amber);margin-left:4px}
.links{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.links a{color:var(--teal)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
</style>
</head>
<body>
<div id="banner"></div>
<div class="wrap">
  <header>
    <div class="logo">Lied<span>dating</span><small>Moderation</small></div>
    <div class="pills" id="pills"></div>
  </header>
  <section class="panel">
    <h2>Gerade auf der Leinwand</h2>
    <div class="now" id="now"></div>
    <div class="controls">
      <button class="btn primary" data-act="draw">Nächstes Duett ziehen</button>
      <button class="btn" data-act="redraw">Neu ziehen</button>
      <button class="btn ghost" data-act="undo">Letztes Duett zurücknehmen</button>
    </div>
    <p class="muted" style="font-size:13px">„Neu ziehen“ nimmt das aktuelle Duett zurück und zieht sofort ein anderes, z.&nbsp;B. wenn jemand gerade nicht da ist. Wer länger weg ist: unten auf „abwesend“ setzen.</p>
  </section>
  <div class="grid">
    <section class="panel">
      <h2>Singles</h2>
      <div class="tablewrap"><table id="people"></table></div>
    </section>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
      <section class="panel"><h2>Setlist</h2><div id="hist"></div></section>
      <section class="panel"><h2>Herzen pro Song</h2><div class="tablewrap"><table id="songs"></table></div></section>
      <section class="panel">
        <h2>Links &amp; Probe</h2>
        <div class="links" id="links"></div>
        <div class="controls">
          <button class="btn small" data-act="bots">+ 20 Test-Singles</button>
          <button class="btn small" data-act="delbots">Test-Singles löschen</button>
          <button class="btn small danger" data-act="reset">Alles zurücksetzen</button>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="lib/firebase-app-compat.js"></script>
<script src="lib/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="songs.js"></script>
<script src="app.js"></script>
<script>
const { SONGS, SONG, Store, analyze, computeDraw, computeUndo, botUpdates, esc, displayName } = LD;
const $ = (s) => document.querySelector(s);
let EV = {}, busy = false;
if (Store.mode === "demo") $("#banner").innerHTML = `<div class="demo-banner">Demo-Modus: keine Firebase-Verbindung eingerichtet. Öffne Leinwand und Anmeldung im selben Browser, um zu testen.</div>`;
const url = (f) => new URL(f, location.href).href;
$("#links").innerHTML = `<a href="${url("leinwand.html")}" target="_blank">Leinwand öffnen</a><a href="${url("index.html")}" target="_blank">Anmeldung (Handy-Ansicht)</a>`;
Store.subscribe((ev) => { EV = ev; render(); });

function render() {
  const A = analyze(EV);
  const w = A.all.filter((p) => p.g === "w"), m = A.all.filter((p) => p.g === "m");
  const swiping = A.all.filter((p) => !p.ready).length;
  const jokers = A.history.filter((h) => h.joker).length;
  $("#pills").innerHTML = `<span class="pill">${w.length} Frauen · ${m.length} Männer</span>
    <span class="pill ${swiping ? "warn" : ""}">${swiping} swipen noch</span>
    <span class="pill">Duette: ${A.history.length}</span>
    <span class="pill ${jokers ? "warn" : "good"}">Joker: ${jokers}</span>
    <span class="pill">${A.allSung ? "Alle haben gesungen" : A.active.filter((p) => !p.sung).length + " ohne Duett"}</span>`;

  const c = A.current;
  $("#now").innerHTML = c
    ? `<div class="plabel">Duett ${c.k}${c.joker ? " · Joker" : ""}</div><div class="display">${esc(SONG[c.song]?.t || c.song)}</div>
       <div class="names"><span class="w">${esc(c.w.name)}</span> <span class="heart">♥</span> <span class="m">${esc(c.m.name)}</span></div>`
    : `<p class="muted">Noch kein Duett. Die Leinwand zeigt den Einlass mit QR-Code.</p>`;
  document.querySelectorAll("[data-act=draw],[data-act=redraw]").forEach((b) => (b.disabled = busy || !A.poolW.length || !A.poolM.length));
  document.querySelector("[data-act=undo]").disabled = busy || !A.history.length;
  document.querySelector("[data-act=redraw]").disabled ||= !A.history.length;

  const rows = [...A.all].sort((a, b) => a.g.localeCompare(b.g) || a.first.localeCompare(b.first));
  $("#people").innerHTML = `<tr><th>Name</th><th>Status</th><th class="n">♥</th><th></th></tr>` + rows.map((p) => {
    const st = !p.ready ? `<span class="st wait">swipt</span>` : p.sung ? `<span class="st sung">gesungen${p.sung > 1 ? " ×" + p.sung : ""}</span>` : `<span class="st ready">im Pool</span>`;
    return `<tr class="${p.away ? "away" : ""}"><td class="${p.g}">${esc(displayName(p))}${p.test ? ` <span class="tag">Test</span>` : ""}</td><td>${p.away ? `<span class="st">abwesend</span>` : st}</td><td class="n">${p.likes.size}</td>
      <td><div class="row-actions"><button class="btn small ghost" data-act="away" data-id="${p.id}">${p.away ? "zurück" : "abwesend"}</button>
      <button class="btn small ghost danger" data-act="del" data-id="${p.id}" aria-label="entfernen">✕</button></div></td></tr>`;
  }).join("") || `<tr><td colspan="4" class="muted">Noch niemand eingecheckt.</td></tr>`;

  $("#hist").innerHTML = A.history.length
    ? `<ol class="hist">${A.history.map((h) => `<li>${esc(SONG[h.song]?.t || h.song)}: <span class="w">${esc(h.w.name)}</span> &amp; <span class="m">${esc(h.m.name)}</span>${h.joker ? `<span class="tag">Joker</span>` : ""}</li>`).join("")}</ol>`
    : `<p class="muted">Noch leer.</p>`;

  const cnt = SONGS.map((s) => ({ s, w: A.active.filter((p) => p.g === "w" && p.likes.has(s.id)).length, m: A.active.filter((p) => p.g === "m" && p.likes.has(s.id)).length }))
    .sort((a, b) => b.w + b.m - (a.w + a.m));
  const max = Math.max(1, ...cnt.map((x) => Math.max(x.w, x.m)));
  $("#songs").innerHTML = `<tr><th>Song</th><th class="n w">F</th><th class="n m">M</th></tr>` + cnt.map((x) =>
    `<tr style="${A.used.has(x.s.id) ? "opacity:.4" : ""}"><td>${esc(x.s.t)}${A.used.has(x.s.id) ? ` <span class="tag">gesungen</span>` : ""}</td>
     <td class="n">${x.w}<span class="bar" style="width:${(x.w / max) * 40}px;background:var(--amber)"></span></td>
     <td class="n">${x.m}<span class="bar" style="width:${(x.m / max) * 40}px;background:var(--teal)"></span></td></tr>`).join("");
}

async function run(fn) { if (busy) return; busy = true; render(); try { await fn(); } finally { busy = false; render(); } }
const ACT = {
  draw: () => run(async () => { const u = computeDraw(EV); if (u) await Store.update(u); }),
  undo: () => run(async () => { const u = computeUndo(EV); if (u) await Store.update(u); }),
  redraw: () => run(async () => {
    const u = computeUndo(EV); if (!u) return;
    const last = analyze(EV).history.slice(-1)[0];
    await Store.update(u);
    // gleiches Paar nicht direkt wieder ziehen: beide kurz als abwesend markieren
    const tmp = { ["people/" + last.w.id + "/away"]: true, ["people/" + last.m.id + "/away"]: true };
    const probe = JSON.parse(JSON.stringify(EV)); for (const [k, v] of Object.entries(tmp)) { const [, id] = k.split("/"); if (probe.people?.[id]) probe.people[id].away = true; }
    const d = computeDraw(probe) || computeDraw(EV);
    if (d) await Store.update(d);
  }),
  away: (b) => { const p = (EV.people || {})[b.dataset.id]; if (p) Store.update({ ["people/" + b.dataset.id + "/away"]: p.away ? null : true }); },
  del: (b) => { const p = (EV.people || {})[b.dataset.id]; if (p && confirm(`${displayName(p)} wirklich entfernen?`)) Store.update({ ["people/" + b.dataset.id]: null }); },
  bots: () => Store.update(botUpdates(20)),
  delbots: () => { const u = {}; Object.entries(EV.people || {}).forEach(([id, p]) => { if (p.test) u["people/" + id] = null; }); if (Object.keys(u).length) Store.update(u); },
  reset: () => { if (confirm("Wirklich ALLES löschen (Singles, Herzen, Setlist)?")) Store.reset(); },
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b || b.disabled) return; ACT[b.dataset.act](b); });
</script>
</body>
</html>
